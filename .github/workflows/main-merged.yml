# This triggers on all merged PRs into main

name: Main - Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  pull-requests: write
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
jobs:
  dev:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[DEV - ${{ matrix.environment_prefix }}]"
    strategy:
      matrix:
        environment_prefix: ${{ fromJSON(vars['ENVIRONMENT_PREFIXES_JSON'] || '[""]') }}
    uses: faccomichele/gha-reusables/.github/workflows/terraform-run.yml@main
    with:
      environment: 'dev'
      region: 'us-east-1'
      global: true
      working-directory: '.'
      environment-prefix: ${{ matrix.environment_prefix }}
      action: 'apply'
      skip-terraform-report: ${{ vars.STS_ENDPOINT && 'true' || 'false' }}
    secrets: inherit

  stg-wait-gate:
    needs: dev
    runs-on: ${{ vars.RUNNERS_AMD64 || 'ubuntu-latest' }}
    environment: stg-wait-gate
    steps:
      - name: Countdown to STG deployment
        run: echo "Waiting for STG deployment gate..."

  stg:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[STG - ${{ matrix.environment_prefix }}]"
    needs: stg-wait-gate
    strategy:
      matrix:
        environment_prefix: ${{ fromJSON(vars['ENVIRONMENT_PREFIXES_JSON'] || '[""]') }}
    uses: faccomichele/gha-reusables/.github/workflows/terraform-run.yml@main
    with:
      environment: 'stg'
      region: 'us-east-1'
      global: true
      working-directory: '.'
      environment-prefix: ${{ matrix.environment_prefix }}
      action: 'apply'
    secrets: inherit

  prod-wait-gate:
    needs: [dev, stg]
    runs-on: ${{ vars.RUNNERS_AMD64 || 'ubuntu-latest' }}
    environment: prod-wait-gate
    steps:
      - name: Countdown to PROD deployment
        run: echo "Waiting for PROD deployment gate..."

  prod:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[PROD - ${{ matrix.environment_prefix }}]"
    needs: prod-wait-gate
    strategy:
      matrix:
        environment_prefix: ${{ fromJSON(vars['ENVIRONMENT_PREFIXES_JSON'] || '[""]') }}
    uses: faccomichele/gha-reusables/.github/workflows/terraform-run.yml@main
    with:
      environment: 'prod'
      region: 'us-east-1'
      global: true
      working-directory: '.'
      environment-prefix: ${{ matrix.environment_prefix }}
      action: 'apply'
    secrets: inherit
    