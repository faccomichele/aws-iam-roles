# This triggers on all merged PRs into main

name: Main - Cleanup/Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  pull-requests: write
  contents: read
      
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev:
    name: "[DEV - ${{ matrix.environment_prefix }}]"
    strategy:
      matrix:
        environment_prefix: ${{ fromJSON(vars['ENVIRONMENT_PREFIXES_JSON'] || '[""]') }}
    uses: faccomichele/gha-reusables/.github/workflows/terraform-run.yml@main
    with:
      environment: 'dev'
      region: 'us-east-1'
      global: true
      working-directory: '.'
      environment-prefix: ${{ matrix.environment_prefix }}
      action: 'destroy'
      skip-terraform-report: ${{ vars.STS_ENDPOINT && 'true' }}
    secrets: inherit

  stg:
    name: "[STG - ${{ matrix.environment_prefix }}]"
    strategy:
      matrix:
        environment_prefix: ${{ fromJSON(vars['ENVIRONMENT_PREFIXES_JSON'] || '[""]') }}
    uses: faccomichele/gha-reusables/.github/workflows/terraform-run.yml@main
    with:
      environment: 'stg'
      region: 'us-east-1'
      global: true
      working-directory: '.'
      environment-prefix: ${{ matrix.environment_prefix }}
      action: 'destroy'
    secrets: inherit

  prod-wait-gate:
    needs: [dev, stg]
    runs-on: ${{ vars.RUNNERS_AMD64 || 'ubuntu-latest' }}
    environment: prod-wait-gate
    steps:
      - name: Countdown to PROD deployment
        run: echo "Waiting for PROD deployment gate..."

  prod:
    name: "[PROD - ${{ matrix.environment_prefix }}]"
    needs: prod-wait-gate
    strategy:
      matrix:
        environment_prefix: ${{ fromJSON(vars['ENVIRONMENT_PREFIXES_JSON'] || '[""]') }}
    uses: faccomichele/gha-reusables/.github/workflows/terraform-run.yml@main
    with:
      environment: 'prod'
      region: 'us-east-1'
      global: true
      working-directory: '.'
      environment-prefix: ${{ matrix.environment_prefix }}
      action: 'destroy'
    secrets: inherit